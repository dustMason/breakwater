name: Deploy web player to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Check and test the shared audio core
        run: |
          cargo fmt --manifest-path Rust/Cargo.toml -- --check
          cargo clippy --all-targets --manifest-path Rust/Cargo.toml -- -D warnings
          Scripts/test_core.sh
          Scripts/test_differential.sh
          python3 Tests/AssetPublisherTests.py
          python3 Tests/AssetRecoveryTests.py
      - name: Test browser audio engine
        run: npm test
      - name: Build static site
        env:
          BREAKWATER_ASSET_BASE_URL: ${{ vars.BREAKWATER_ASSET_BASE_URL }}
        run: python3 Scripts/build_web.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
